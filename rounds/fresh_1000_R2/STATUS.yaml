program: fresh_1000_R2
advance_policy: "20 种污染物 × 50 方案 = 1000 方案槽；每方案须与 R1 已覆盖角度/机制/材料组合正交；通过线 85/100 + 零未决 critical/high + 创新性清单通过；广度优先（每污染物至少 1 个 R2 方案后推进下一污染物）；诚实耗尽条款保留。"
created: 2026-07-29
spec: rounds/fresh_1000_R2/SPEC.md
closeout: rounds/fresh_1000_R2/R2_CLOSEOUT.md   # completion assessment + honest reality + remaining path (2026-07-30)
r1_baseline: rounds/fresh_1000/STATUS.yaml
occupied_space: rounds/fresh_1000_R2/R1_OCCUPIED_SPACE.yaml
pollutant_count: 20
target_per_pollutant: 50
total_target: 1000
quality_gate: "score>=85, 0 unresolved critical/high, innovation checklist pass, full closed loop, R1-DEDUP pass"
iteration_policy:
  rounds_per_concept: 2
  max_rebuilds_per_slot: 3
  exhaustion_recorded_honestly: true
  intermediate_artifacts_persisted: true
execution_order: [pfoa, pfbs, pfhxs, genx, bpa, np, dcp26, rox, octocrylene, ddt, dde, dieldrin, endosulfan, betahch, tcdd, pcb209, pcp, hcbd, chloroform, bde209]
milestones:
  M1_prototype_library_120: "pending (90/120; R2 near-exhaustion generates few new prototypes - honest)"
  M2_all_20_pollutants_1_scheme: "ACHIEVED 2026-07-30 (20/20 covered, breadth-first complete)"
  M3_100_schemes_completed: "pending (20 R2 slots; breadth-first done, depth backfill would add more)"
  M4_30_schemes_passed: "pending (0 R2 passed; orthogonal-space honest reality - see r2_score_trajectory_note)"
  M5_60_schemes_passed: "pending (0 R2 passed)"
  M6_knowledge_graph: "ACHIEVED 2026-07-30 (4-dim network: 90 prototypes / 20 mechanisms / 3 materials / 20 pollutants + edges)"
