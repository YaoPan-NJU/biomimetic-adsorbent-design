transferable_knowledge: >
  可传递正知识（与 MECH pfoa anion-π 互补）：PFAS 组头基-水合识别方向——anion-π 偏好高电荷密度硫酸根=选择性负债；
  趋液效应偏好弱水化 PFAS、排斥硫酸根=选择性资产。趋液路线对 PFHxS/GenX 等更长/更趋液 PFAS 的绝对亲和力优于 PFBS，
