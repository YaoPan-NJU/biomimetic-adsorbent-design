  sulfate_competition: "解决（趋液效应内禀排斥强水化二价硫酸根，方向优于 anion-π 与静电捕获）"
  short_chain_affinity: "边缘（C4 为 PFSA 最短、趋液性最弱；SETAC 2026 短链对 CD 腔亲和力低；ng/L 占位需 Ka≥10⁶-10⁸ 量级）"
  net_binding_free_energy_kj_mol: "待量热(ITC)+Phase 0 计算 C4 趋液绝对 Ka 与 α(PFBS/SO₄²⁻)"
  critical_risk: "C4 短链绝对亲和力不足（ng/L 边缘）+ 逆向尺寸窗口排 PFOS 硬约束"
