# 每个机制-污染物组合独立记录（SPEC 3.1b）

mechanism_id: MECH_pfbs_001
pollutant: pfbs
mechanism_name: "趋液（chaotropic/Hofmeister）水合热力学识别 + C4 尺寸窗口"
biological_source: "生物阴离子通道的 Hofmeister/趋液序选择性（PROTO_R2_002）"
material_implementation: >
  竹环（bambusuril）/葫芦脲（cucurbituril）型高能水释放受限腔或深疏水限尺寸有机笼，接枝水稳定多孔载体；腔形按 C4F9 契合
  + 高能水释放优化。三层：层 A 趋液水合门（高能水释放腔优先纳弱水化 PFBS、内禀排斥强水化二价硫酸根，创新+承重）/ 层 B
  C4 尺寸窗口（限尺寸腔口，承重待验，逆向排 PFOS 硬约束）/ 层 C 弱疏水基线（单调容量）。
selectivity_signature:
  primary_dimension: "趋液水合轴（Hofmeister 位次，优先弱水化 PFBS、排斥强水化硫酸根/磷酸根）"
  orthogonal_dimensions:
    - "C4 尺寸窗口/腔深轴（限尺寸腔口调 C4 契合，可由 C4/C6/C8 排除系列解耦）"
    - "（承重收窄）主张限于 PFBS vs 无机含氧阴离子；放弃 PFAS 类内分离（趋液偏好更长 PFOS）"
  causal_control: "Hofmeister 序滴定（选择性随趋液性单调、随电荷密度反相关）+ ITC 焓-熵分解（高能水释放熵驱动）+ 腔深系列"
aqueous_feasibility:
