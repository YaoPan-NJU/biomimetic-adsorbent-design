# 仿生原型卡片 — fresh_1000 Round 2
# 每个新发现的仿生原型独立成卡（SPEC 3.1a）

prototype_id: PROTO_R2_001
name: "黄素蛋白 anion-π 相互作用"
source_type: protein
biological_origin: >
  黄素蛋白（flavoproteins）中缺电子异咯嗪（isoalloxazine）环及缺电子芳香残基与阴离子/阴离子性辅因子之间的
  anion-π 相互作用；更广义地，anion-π 相互作用在蛋白质与核酸中广泛自然存在（大规模 PDB 统计）。生物功能为
  稳定黄素辅因子并调制其氧化还原电位（含显著电荷转移分量），而非从竞争水基质中选择性捕获阴离子。
applicable_pollutants: ["pfoa"]   # 候选可扩展至其他含氧阴离子污染物（pfbs/genx 头基），R2 后续评估
recognition_mechanism: >
  缺电子芳香 π 面（正四极矩）对阴离子提供 anion-π 定向静电+诱导+电荷转移稳定；结合强度随阴离子电荷密度升高
  而增强（此特性对本项目为双刃：偏好高电荷密度二价硫酸根，对单价全氟羧酸头基选择性为潜在负债）。
