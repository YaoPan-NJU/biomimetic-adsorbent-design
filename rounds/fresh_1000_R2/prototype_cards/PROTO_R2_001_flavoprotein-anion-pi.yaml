    year: 2015
    claim_supported: "anion-π 相互作用在蛋白质与核酸中广泛自然存在（大规模 PDB 分析）——自然进化存在性锚"
    evidence_tier: source_backed_lead
  - doi: "Chem Eur J 2017, 23:3246（Yurenko 等；DOI 待全文核）"
    title: "Anion–π Interactions in Flavoproteins Involve a Substantial Charge Transfer Component"
    year: 2017
    claim_supported: "黄素蛋白 anion-π 稳定黄素并调制氧化还原电位，含显著电荷转移分量"
    evidence_tier: source_backed_lead
  - doi: "10.1039/... ChemCommun 2016, 52:1778（Giese 等；DOI 待核）"
    title: "Experimental investigation of anion–π interactions"
