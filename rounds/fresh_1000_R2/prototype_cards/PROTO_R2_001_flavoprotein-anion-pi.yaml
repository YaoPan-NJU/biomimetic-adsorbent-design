    evidence_tier: fact
translation_distance_note: >
  转译距离大：生物功能（氧化还原调制/辅因子结合）≠ 水相选择性阴离子捕获。作机制类比层转译，创新性清单 C 维
  诚实不通过（anion-π 为 Schneider/Matile 以降通用超分子原则，非黄素蛋白特异提取）。
evolution_solution_judgement: >
  条件性通过 G2"自然界进化解决方案"判据：anion-π 在黄素蛋白中确为进化出的阴离子结合物理（非 SELEX/非配位化学/
  非毒性受体）；但其进化目的是辅因子氧化还原调制，与"选择性水相阴离子捕获"仅机制类比而非功能同源，故仅承载
  机制类比级仿生强度。
r1_used: false
r2_first_used_in: "R2_S01_A01（PFOA anion-π 缺电子 π 面识别）"
r2_outcome_note: >
  首次使用即暴露该原型对本项目的关键局限：anion-π 偏好高电荷密度阴离子（硫酸根），对单价全氟羧酸根选择性为
  潜在负债。R2_S01_A01 落 revise_with_phase0_prerequisite（~74/100），Phase 0 计算门挂起裁定。
