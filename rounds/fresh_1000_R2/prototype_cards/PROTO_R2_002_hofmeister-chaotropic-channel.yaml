translation_distance_note: >
  转译距离大：生物功能（通道通透/电导调制）≠ 水相选择捕获；趋液效应为通用超分子物化原理（Nau/Assaf）。作机制类比层转译，
  创新性 C 维诚实不通过（同 anion-π/氧阴离子洞）。
evolution_solution_judgement: >
  条件性通过 G2：生物通道的 Hofmeister 选择性为进化出的阴离子选择物理（非 SELEX/非配位/非毒性受体），但进化目的为通透调制，
  与"选择性水相阴离子捕获"仅机制类比，承载机制类比级仿生强度。
key_advantage: >
  与 anion-π（PROTO_R2_001）方向互补：趋液效应内禀排斥强水化硫酸根，正面解决 PFAS 吸附的头号竞争陷阱（硫酸根竞争）。
key_limitation: >
  绝对亲和力随链长单调（趋液性/疏水面积），对最短链 PFBS 边缘（SETAC 2026 短链对 CD 腔亲和力低）；趋液轴不区分 PFBS 与更长
  PFOS（PFOS 更趋液→结合更强），类内分离须额外尺寸窗口（逆向链长，硬）。
r1_used: false
r2_first_used_in: "R2_S02_A01（PFBS 趋液 × C4 尺寸窗口）"
r2_outcome_note: >
  首次使用（PFBS）落 revise_with_phase0_prerequisite（~72/100）：趋液轴正面解决硫酸根竞争（方向正确），但 C4 短链绝对亲和力边缘
  + 逆向尺寸窗口排 PFOS 硬约束，主张收窄为 PFBS vs 无机阴离子。量热/Phase 0 门挂起。
