# 仿生原型卡片 — fresh_1000 Round 2
# 每个新发现的仿生原型独立成卡（SPEC 3.1a）

prototype_id: PROTO_R2_002
name: "生物阴离子通道的 Hofmeister/趋液序选择性"
source_type: protein
biological_origin: >
  生物离子通道对阴离子的选择性/电导遵循 Hofmeister（lyotropic/趋液）序：弱水化（趋液，chaotropic）阴离子（如 SCN⁻、ClO4⁻）
  与通道内低电荷密度/疏水结合区作用更强，强水化（kosmotropic）阴离子（如 SO4²⁻、H2PO4⁻）作用弱。生物功能为离子通透与
  电导调制，而非从竞争水基质中选择性捕获阴离子。趋液效应的物化基础为高能水从疏水腔/结合区释放（焓-熵补偿，Nau/Assaf）。
applicable_pollutants: ["pfbs", "pfhxs", "genx", "pfoa"]   # 弱水化 PFAS 阴离子头基普适；R2 后续按链长评估绝对亲和力
recognition_mechanism: >
  按 Hofmeister 位次读取阴离子水化自由能：优先结合弱水化/趋液阴离子（PFAS 头基），内禀排斥强水化二价硫酸根/磷酸根。
  与 anion-π 方向相反（anion-π 偏好高电荷密度硫酸根=负债；趋液偏好弱水化 PFAS=资产）。绝对亲和力随链长（趋液性/疏水面积）
  升高，故对最短链 PFBS 边缘、对 C6/C8 更强。
